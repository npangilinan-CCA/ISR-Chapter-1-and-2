<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISR Chapters 1 &amp; 2 — Flashcard Reviewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1b130d;
    --panel: #271b13;
    --panel-2: #2e2017;
    --line: #4d382a;
    --line-soft: #352619;
    --text: #f4eadf;
    --muted: #bfa48c;
    --muted-2: #8c7059;
    --cyan: #dba46b;
    --cyan-dim: #94612f;
    --amber: #e6c08a;
    --amber-dim: #6b4a24;
    --card-back: #21160f;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body{
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    background-attachment: fixed;
  }

  .wrap{
    max-width: 860px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }

  header{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap: 10px;
  }

  .brand .dot{
    width: 9px; height:9px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    display:inline-block;
    transform: translateY(-2px);
  }

  h1{
    font-family:'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .subtitle{
    font-size: 13px;
    color: var(--muted);
    font-family:'IBM Plex Mono', monospace;
  }

  .stat{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    text-align: right;
  }

  .stat b{ color: var(--cyan); font-weight:600; }

  /* module tabs */
  .modules{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 26px;
  }

  .mod-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
    line-height: 1.3;
  }

  .mod-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }

  .mod-btn.active{
    border-color: var(--cyan);
    color: var(--bg);
    background: var(--cyan);
    font-weight: 600;
  }

  .mod-btn .count{
    opacity: .65;
    margin-left: 4px;
  }
  .mod-btn.active .count{ opacity:.55; }

  /* chapter selector */
  .nav-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 1.5px;
    color: var(--muted-2);
    margin-bottom: 8px;
  }

  .chapters{
    display:flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .chap-btn{
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .chap-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }
  .chap-btn.active{
    background: var(--cyan);
    border-color: var(--cyan);
    color: var(--bg);
  }
  .chap-btn .count{ opacity:.6; font-weight:500; margin-left:6px; font-size: 12px; }

  /* front-side mode toggle */
  .mode-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .mode-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted-2);
  }

  .mode-toggle{
    display:inline-flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }

  .mode-opt{
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }

  .mode-opt:hover{ color: var(--text); }

  .mode-opt.active{
    background: var(--cyan);
    color: var(--bg);
    font-weight: 600;
  }

  /* card area */
  .stage{
    display:flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .progress-row{
    width: 100%;
    display:flex;
    align-items:center;
    gap: 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted-2);
  }

  .progress-track{
    flex:1;
    height: 4px;
    background: var(--line-soft);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
    width: 0%;
    transition: width .25s ease;
  }

  .card-scene{
    width: 100%;
    max-width: 640px;
    perspective: 1400px;
  }

  .card{
    position: relative;
    width: 100%;
    min-height: 260px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.4,.2,.2,1);
  }

  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    backface-visibility: hidden;
    border-radius: 12px;
    border: 1px solid var(--line);
    padding: 34px 32px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap: 14px;
  }

  .face-front{
    background: var(--panel);
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 18px 40px -20px rgba(0,0,0,.6);
  }

  .face-back{
    background: var(--card-back);
    transform: rotateY(180deg);
    border-color: var(--cyan-dim);
  }

  .face-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 1.5px;
    color: var(--muted-2);
  }

  .term{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(19px, 3.4vw, 26px);
    font-weight: 600;
    color: var(--cyan);
    line-height: 1.35;
  }

  .definition{
    font-size: 16.5px;
    line-height: 1.55;
    color: var(--text);
    max-width: 480px;
  }

  .hint{
    position:absolute;
    bottom: 14px;
    font-size: 11px;
    color: var(--muted-2);
    font-family:'IBM Plex Mono', monospace;
  }

  .controls{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 4px;
  }

  .ctrl-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap: 6px;
    transition: border-color .15s ease, transform .1s ease;
  }

  .ctrl-btn:hover{ border-color: var(--cyan-dim); }
  .ctrl-btn:active{ transform: scale(0.97); }

  .ctrl-btn.primary{
    background: var(--cyan);
    color: var(--bg);
    border-color: var(--cyan);
    font-weight: 600;
  }
  .ctrl-btn.primary:hover{ opacity: .9; }

  .ctrl-btn.ghost{ color: var(--muted); }

  .ctrl-btn svg{ width: 14px; height:14px; }

  .kbd-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted-2);
    margin-top: 2px;
  }
  .kbd-hint kbd{
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: inherit;
    color: var(--muted);
  }

  footer{
    text-align:center;
    margin-top: 44px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted-2);
  }

  @media (max-width: 520px){
    .face{ padding: 26px 20px; }
    header{ flex-direction: column; align-items:flex-start; }
    .stat{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .progress-fill{ transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <div class="brand"><span class="dot"></span><h1>ISR Chapters 1 &amp; 2 — Flashcards</h1></div>
      <div class="subtitle">capstone chapter 1 · RRL · RRS · sources · synthesis</div>
    </div>
    <div class="stat">
      <div><b id="totalCount">0</b> terms loaded</div>
      <div id="moduleLabel">Chapter 1 · All</div>
    </div>
  </header>

  <div class="nav-label">CHAPTER</div>
  <div class="chapters" id="chapterTabs"></div>
  <div class="nav-label">CATEGORY</div>
  <div class="modules" id="moduleTabs"></div>

  <div class="mode-row">
    <span class="mode-label">Show first:</span>
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-opt active" data-mode="term">Term</button>
      <button class="mode-opt" data-mode="def">Definition</button>
    </div>
  </div>

  <div class="stage">
    <div class="progress-row">
      <span id="cardPos">1 / 10</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="flipState">tap to flip</span>
    </div>

    <div class="card-scene">
      <div class="card" id="card">
        <div class="face face-front">
          <span class="face-label" id="frontLabel">TERM</span>
          <div class="term" id="frontText"></div>
          <span class="hint">click card / press space</span>
        </div>
        <div class="face face-back">
          <span class="face-label" id="backLabel" style="color:var(--cyan)">DEFINITION</span>
          <div class="definition" id="backText"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn ghost" id="prevBtn" title="Previous (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        Prev
      </button>
      <button class="ctrl-btn primary" id="flipBtn">Flip card</button>
      <button class="ctrl-btn ghost" id="nextBtn" title="Next (→)">
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Shuffle category
      </button>
      <button class="ctrl-btn" id="restartBtn">Restart order</button>
    </div>
    <div class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> navigate &nbsp; <kbd>space</kbd> flip &nbsp; <kbd>S</kbd> shuffle</div>
  </div>

  <footer>Source: ISR reviewer — Chapters 1 &amp; 2</footer>
</div>

<script>
const DATA = [
 {
  "chapter": "Chapter 1",
  "sections": [
   {
    "short": "Capstone & Background",
    "module": "Capstone & Background",
    "terms": [

   {

     [

    ]
   }
  ]
 },
 {
  "chapter": "Chapter 2",
  "sections": [
   {
    "module": "CHAPTER 2 — RRL and RRS",
    "short": "RRL Basics",
    "terms": [
     [
      "Suggested Chapter 2 structure",
      "Related literature, Related studies, Framework, Synthesis"
     ],
     [
      "RRL",
      "Clarifies concepts you need to understand. Show how similar problems have been addressed. Helps identify feature and quality factors. Guides the evaluation approach. Prevents reinventing weak ideas."
     ],
     [

     ],
     [

      "previous research, implemented systems, methods, findings, & lessons."
     ],
     [

      "ideas and foundations"
     ],
     [
      "Studies",
      "prior investigations and implementations."

    ]
   },
   {
    "module": "CHAPTER 2 — What Counts as RRL and RRS",
    "short": "RRL & RRS Sources",
    "terms": [
     [
      "What count as RRL",
      "Books, Theory / models, Standards, Technical references, Institutional / Government Resources"
     ],
     [
      "Books",

     ],
     [
      "Theory / models",
      "Ways to explain behavior, success, acceptance, usability"
     ],
     [

      "Quality, security, data, or process guidance"
     ],

     ],

     ]
    ]
   },
   {
    "module": "CHAPTER 2 — Search Strategy",
    "short": "Search Strategy",
    "terms": [
     [
      "Search strategy",

     ],
     [

     ],

      "Peer-reviewed journal, Conference proceedings, University repositories, Government / Institutional publications, Professional standards and official docs, Books and reputable academic text"

    ]
   },
   {
    "module": "CHAPTER 2 — Screening Sources",
    "short": "Screening Sources",
    "terms": [
     [
      "Screen the sources before you use them",
      "Relevance, Recency, Authority, Method, Evidence, Fit"
     ],
     [
      "Relevance",
      "Does it directly support the project concept or context?"
     ],

   },
   {

    "short": "Summary to Synthesis",
    "terms": [
     [
      "From Summary to Synthesis",
      "Summarize, Compare, Synthesize"
     ],
     [
      "Summarize",
      "(What did the source say?) Capture the relevant idea, method, or finding."
     ],
     [
      "Compare",
      "(How does it relate to other sources?) Look for agreements, differences, methods, and limitations."
     ],
     [

      "(What does the body of evidence imply for your project?) End with the project need or design implication."
     ],
     [
      "Strong rrl",
      "Several studies shows."
     ],
     [

      "often looks like copied summaries connected by weak transition"
     ]
    ]
   },
   {
    "module": "CHAPTER 2 — Turn Literature Into Requirements",
    "short": "Literature to Requirements",
    "terms": [
     [
      "Turn literature into requirements",
      "Literature finding, Investigation evidence, Requirement, Evaluation item"
     ],
     [
      "Literature finding",
      "users value easy status visibility"
     ],
     [
      "Investigation evidence",
      "users repeatedly ask for request status"
     ],
     [
      "Requirement",

      "users can locate status without assistance."

  ]
 }
];

let ci = 0;          // current chapter index
let si = 0;          // current category index (0 = All)
let order = [];
let currentIndex = 0;
let flipped = false;
let mode = 'term';   // 'term' = term shown first, 'def' = definition shown first

const chapterTabsEl = document.getElementById('chapterTabs');
const moduleTabsEl = document.getElementById('moduleTabs');
const frontText = document.getElementById('frontText');
const backText = document.getElementById('backText');
const frontLabel = document.getElementById('frontLabel');
const backLabel = document.getElementById('backLabel');
const cardEl = document.getElementById('card');
const cardPos = document.getElementById('cardPos');
const progressFill = document.getElementById('progressFill');
const moduleLabel = document.getElementById('moduleLabel');
const totalCount = document.getElementById('totalCount');
const flipState = document.getElementById('flipState');

function chapterCount(c){ return c.sections.reduce((n, s) => n + s.terms.length, 0); }

function current(){
  const ch = DATA[ci];
  if(si === 0){
    return { name: 'All', title: 'All categories', terms: ch.sections.flatMap(s => s.terms) };
  }
  const s = ch.sections[si - 1];
  return { name: s.short, title: s.module, terms: s.terms };
}

function buildChapterTabs(){
  chapterTabsEl.innerHTML = '';
  DATA.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'chap-btn' + (i === ci ? ' active' : '');
    btn.innerHTML = c.chapter + '<span class="count">' + chapterCount(c) + '</span>';
    btn.addEventListener('click', () => selectChapter(i));
    chapterTabsEl.appendChild(btn);
  });
}

function buildTabs(){
  moduleTabsEl.innerHTML = '';
  const ch = DATA[ci];
  const items = [{ label: 'All', count: chapterCount(ch), title: 'All of ' + ch.chapter }]
    .concat(ch.sections.map(s => ({ label: s.short, count: s.terms.length, title: s.module })));
  items.forEach((it, i) => {
    const btn = document.createElement('button');
    btn.className = 'mod-btn' + (i === si ? ' active' : '');
    btn.title = it.title;
    btn.innerHTML = it.label + '<span class="count">' + it.count + '</span>';
    btn.addEventListener('click', () => selectSub(i));
    moduleTabsEl.appendChild(btn);
  });
}

function selectChapter(i){
  ci = i;
  selectSub(0);
}

function selectSub(i){
  si = i;
  order = current().terms.map((_, k) => k);
  currentIndex = 0;
  flipped = false;
  buildChapterTabs();
  buildTabs();
  render();
}

function render(){
  const cur = current();
  const [term, def] = cur.terms[order[currentIndex]];

  if(mode === 'term'){
    frontLabel.textContent = 'TERM';
    backLabel.textContent = 'DEFINITION';
    frontText.textContent = term;
    backText.textContent = def;
    frontText.className = 'term';
    backText.className = 'definition';
  } else {
    frontLabel.textContent = 'DEFINITION';
    backLabel.textContent = 'TERM';
    frontText.textContent = def;
    backText.textContent = term;
    frontText.className = 'definition';
    backText.className = 'term';
  }

  cardEl.classList.toggle('flipped', flipped);
  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';
  cardPos.textContent = (currentIndex + 1) + ' / ' + cur.terms.length;
  progressFill.style.width = (((currentIndex + 1) / cur.terms.length) * 100) + '%';
  moduleLabel.textContent = DATA[ci].chapter + ' · ' + cur.name;
  totalCount.textContent = DATA.reduce((sum, c) => sum + chapterCount(c), 0);
}

function setMode(newMode){
  mode = newMode;
  flipped = false;
  document.querySelectorAll('.mode-opt').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === newMode);
  });
  render();
}

function flip(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
  flipState.textContent = flipped ? ('showing ' + (mode === 'term' ? 'definition' : 'term')) : 'tap to flip';
}

function next(){
  currentIndex = (currentIndex + 1) % order.length;
  flipped = false;
  render();
}

function prev(){
  currentIndex = (currentIndex - 1 + order.length) % order.length;
  flipped = false;
  render();
}

function shuffleModule(){
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  currentIndex = 0;
  flipped = false;
  render();
}

function restartOrder(){
  order = current().terms.map((_, k) => k);
  currentIndex = 0;
  flipped = false;
  render();
}

document.querySelectorAll('.mode-opt').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

cardEl.addEventListener('click', flip);
document.getElementById('flipBtn').addEventListener('click', flip);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('shuffleBtn').addEventListener('click', shuffleModule);
document.getElementById('restartBtn').addEventListener('click', restartOrder);

document.addEventListener('keydown', (e) => {
  if(e.code === 'Space'){ e.preventDefault(); flip(); }
  else if(e.code === 'ArrowRight'){ next(); }
  else if(e.code === 'ArrowLeft'){ prev(); }
  else if(e.code === 'KeyS'){ shuffleModule(); }
});

selectChapter(0);
</script>

</body>
